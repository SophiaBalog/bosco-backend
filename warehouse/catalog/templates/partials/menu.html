{% load catalog_extras %}
<nav class="main-nav">
    <a href="{% url 'product_list' %}">Список товарів</a> |
    <a href="{% url 'add_product' %}">Додати товар</a> |
    <a href="{% url 'inventory_list' %}">Інвентар</a> |
    <a href="{% url 'inventory_alerts' %}">Попередження</a> |
    {% if user.is_authenticated %}
        <a href="{% url 'manage_list' %}">Керування товарами</a> |
        {% if perms.catalog.view_stats %}<a href="{% url 'stats' %}">Звіт</a> |{% endif %}
        <form method="post" action="{% url 'logout' %}" style="display:inline">
            {% csrf_token %}
            <button type="submit">Вийти ({{ user.username }})</button>
        </form> |
    {% else %}
        <a href="{% url 'login' %}">Увійти</a> |
    {% endif %}
    <span>Всього товарів у базі: <strong>{% product_count %}</strong></span>
</nav>
